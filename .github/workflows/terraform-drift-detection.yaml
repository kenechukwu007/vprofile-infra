name: Terraform Drift Detection

on:
  schedule:
    # Run drift detection daily at 2 AM UTC
    - cron: '0 2 * * *'
  
  workflow_dispatch:
    inputs:
      notify_slack:
        description: 'Notify Slack on drift'
        required: false
        default: 'true'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  drift-detection:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_BACKEND_KEY }}" \
            -backend-config="region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_DYNAMODB }}"

      - name: Refresh Terraform State
        id: refresh
        run: |
          echo "🔄 Refreshing Terraform state from AWS..."
          terraform refresh -no-color || echo "⚠️  Some resources could not be refreshed"

      - name: Plan with Refresh
        id: plan
        run: |
          terraform plan -no-color -out=drift_plan
          terraform show -no-color drift_plan > drift_output.txt
          
          # Check if there are any changes
          if grep -q "No changes" drift_output.txt; then
            echo "drift_detected=false" >> $GITHUB_OUTPUT
          else
            echo "drift_detected=true" >> $GITHUB_OUTPUT
          fi
          
          cat drift_output.txt

      - name: Capture Drift Details
        if: steps.plan.outputs.drift_detected == 'true'
        run: |
          {
            echo "drift_details<<EOF"
            cat drift_output.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Drift Detection Issue
        if: steps.plan.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const driftOutput = fs.readFileSync('drift_output.txt', 'utf8');
            
            const issue_body = `## 🚨 Terraform Drift Detected

            **Timestamp**: ${new Date().toISOString()}
            **Commit**: ${{ github.sha }}
            
            ### Changes Detected
            \`\`\`
            ${driftOutput}
            \`\`\`
            
            ### Action Required
            Review the drift and either:
            1. Apply the changes using the [Terraform Apply Workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/terraform-apply.yaml)
            2. Import the changes into Terraform state
            3. Update Terraform configuration to match actual state
            
            ### Suspected Causes
            - Manual changes made to AWS resources
            - External deployment overwriting configuration
            - ArgoCD or other GitOps tool making changes
            
            ---
            *Auto-generated by drift detection workflow*`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Terraform Drift Detected - Action Required',
              body: issue_body,
              labels: ['drift', 'terraform', 'urgent']
            });

      - name: Compare with Last Known State
        run: |
          echo "📊 Drift Detection Summary"
          echo "=========================="
          if grep -q "No changes" drift_output.txt; then
            echo "✅ No drift detected - infrastructure matches configuration"
          else
            echo "⚠️  Drift detected - infrastructure differs from configuration"
          fi

      - name: Get EKS ConfigMap
        run: |
          CLUSTER_NAME="${{ secrets.EKS_CLUSTER_NAME || 'vprofile-eks-cluster' }}"
          echo "Checking ArgoCD status on EKS cluster: $CLUSTER_NAME"
          
          aws eks update-kubeconfig --name "$CLUSTER_NAME" 2>/dev/null || true
          
          if kubectl cluster-info &>/dev/null; then
            echo "📍 ArgoCD Application Status:"
            kubectl get applications -n argocd 2>/dev/null || echo "⚠️  ArgoCD not found in cluster"
          else
            echo "⚠️  Could not connect to EKS cluster"
          fi
        continue-on-error: true

      - name: Notify Slack - Drift Detected
        if: steps.plan.outputs.drift_detected == 'true' && (github.event.inputs.notify_slack != 'false' || github.event_name == 'schedule')
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "🚨 Terraform Drift Detected in vprofile-infra",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Terraform Drift Alert*\n*Repository*: vprofile-infra\n*Status*: ⚠️  Drift Detected\n*Action*: Review the <${{ github.server_url }}/${{ github.repository }}/issues|GitHub Issue> and apply changes or investigate cause"
                  }
                }
              ]
            }
        continue-on-error: true

      - name: Notify Slack - No Drift
        if: steps.plan.outputs.drift_detected == 'false' && github.event_name == 'schedule'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Terraform Drift Detection - Clean",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Drift Detection Result*\n*Repository*: vprofile-infra\n*Status*: ✅ No Drift Detected\n*Time*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        continue-on-error: true

      - name: Upload Drift Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: drift-report-${{ github.run_id }}
          path: drift_output.txt
          retention-days: 30
