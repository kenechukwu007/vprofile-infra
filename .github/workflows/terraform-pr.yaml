name: Terraform Validate & Plan on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - 'terraform.tfvars'
      - '.github/workflows/terraform-pr.yaml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform-validate-plan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_BACKEND_KEY }}" \
            -backend-config="region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_DYNAMODB }}"

      - name: Terraform Validate
        run: terraform validate
        
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan_output.txt
        continue-on-error: true

      - name: Terraform Plan Summary
        id: plan_summary
        run: |
          {
            echo "plan_output<<EOF"
            cat plan_output.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('plan_output.txt', 'utf8');
            
            const comment = `## Terraform Plan 📋
            
            <details><summary>Show Plan</summary>
            
            \`\`\`
            ${planOutput}
            \`\`\`
            
            </details>
            
            ### Summary
            - **Status**: ✅ Plan generated successfully
            - **Next Step**: Merge to main and click apply button
            - **Branch**: ${{ github.head_ref }}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v3
        with:
          name: tfplan-${{ github.run_id }}
          path: tfplan
          retention-days: 5

  eks-validation:
    runs-on: ubuntu-latest
    needs: terraform-validate-plan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Validate EKS Cluster Configuration
        run: |
          CLUSTER_NAME="${{ secrets.EKS_CLUSTER_NAME || 'vprofile-eks-cluster' }}"
          echo "Validating against EKS cluster: $CLUSTER_NAME"
          
          # Get cluster info
          aws eks describe-cluster --name "$CLUSTER_NAME" --query 'cluster.{Name:name,Version:version,Status:status}' || echo "⚠️  Cluster not found or validation skipped"
          
          # Get kubeconfig
          aws eks update-kubeconfig --name "$CLUSTER_NAME" 2>/dev/null || true
          
          echo "✅ EKS cluster validation complete"

      - name: Check Kubernetes API Compatibility
        run: |
          if kubectl cluster-info &>/dev/null; then
            echo "📍 Connected to EKS cluster"
            kubectl version --short
            kubectl get nodes -o wide || echo "⚠️  Could not fetch nodes"
          else
            echo "⚠️  kubectl not configured - skipping cluster connection"
          fi
        continue-on-error: true
