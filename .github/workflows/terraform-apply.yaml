name: Terraform Apply (Manual)

on:
  workflow_run:
    workflows: ["Terraform Validate & Plan on PR"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_BACKEND_KEY }}" \
            -backend-config="region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_DYNAMODB }}"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan_output.txt

      - name: Wait for Manual Approval
        run: |
          echo "✋ Waiting for manual approval to apply changes..."
          echo "Please review the plan and approve in GitHub Actions"
          sleep 5

      - name: Terraform Apply
        id: apply
        run: |
          echo "🚀 Applying Terraform changes..."
          terraform apply -no-color -auto-approve tfplan > apply_output.txt 2>&1
          cat apply_output.txt

      - name: Capture Apply Output
        if: always()
        run: |
          {
            echo "apply_output<<EOF"
            cat apply_output.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Post Apply Status
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const context_payload = context.payload.workflow_run;
            const status = '${{ job.status }}' === 'success' ? '✅ SUCCESS' : '❌ FAILED';
            
            const comment = `## Terraform Apply Status 🔧
            
            - **Status**: ${status}
            - **Commit**: ${{ github.sha }}
            - **Run**: ${{ github.run_id }}
            
            <details><summary>Apply Logs</summary>
            
            \`\`\`
            Check the full logs in the workflow run
            \`\`\`
            
            </details>
            
            Next: Drift detection will run after 5 minutes or can be triggered manually.`;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: '${{ github.sha }}',
              body: comment
            });

      - name: Upload Apply Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: terraform-apply-${{ github.run_id }}
          path: |
            tfplan
            apply_output.txt
          retention-days: 7

      - name: Notify Slack on Apply
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Terraform Apply on vprofile-infra",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Terraform Apply Completed*\nStatus: ${{ job.status }}\nCommit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  }
                }
              ]
            }
        continue-on-error: true
